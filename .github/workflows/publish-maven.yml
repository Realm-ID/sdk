name: publish-maven

# Publishes the Java SDK (dev.realmid:sdk) to Maven Central via the Central
# Portal (central.sonatype.com — OSSRH was sunset 2025).
#
# Auth (all repo secrets):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD — a Central Portal user
#       token (Account → Generate User Token). NOT the portal login.
#   MAVEN_GPG_PRIVATE_KEY  — ASCII-armored GPG private key (whole
#       -----BEGIN PGP PRIVATE KEY BLOCK-----). Its public half must be on a
#       public keyserver so Central can verify signatures.
#   MAVEN_GPG_PASSPHRASE   — that key's passphrase.
#
# The `dev.realmid` namespace must be verified on the Portal (DNS TXT on
# realmid.dev) before the first publish will be accepted.
#
# Trigger: manual (workflow_dispatch) or pushing a `java-vX.Y.Z` tag. The
# version published is whatever `java/build.gradle.kts` declares at that ref —
# keep the tag and the `version` in lockstep. Re-publishing an existing
# version is rejected by Central (immutable), so bump the version per release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'java-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tag OBJECT is needed, not just the commit


      # Runs BEFORE anything publishes, deliberately: a lightweight tag here is
      # still fixable (delete, re-cut with -a) because no registry has seen the
      # artifact yet. That is the opposite of `go/v*`, where the tag IS the
      # release — hence the separate `annotated-prepublish` mode, which prints
      # the recut remedy instead of "ship the next patch version".
      #
      # Only on a tag push: a workflow_dispatch has no tag to check.
      - name: The release tag is annotated
        if: github.event_name == 'push'
        run: ./scripts/tag-hygiene.sh annotated-prepublish "${{ github.ref_name }}"

      # Runs BEFORE the publish, and on workflow_dispatch too (it reads
      # build.gradle.kts, not the tag). `java-v0.34.0` shipped with no
      # changelog entry and nothing noticed for weeks.
      - name: The release version has a changelog entry
        run: ./scripts/changelog-hygiene.sh maven

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Publish to Maven Central
        working-directory: java
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        # Idempotent, like publish-npm's per-package publish: an already-released
        # version is a SKIP, not a failure.
        #
        # Added 2026-08-31, and the reason it was added was WRONG — recorded
        # here so nobody re-derives the wrong one. The prediction was that
        # re-pushing a release tag re-uploads coordinates Central already holds,
        # Central rejects the duplicate, and a red run attaches permanently to a
        # tag whose release succeeded. MEASURED the same day: it does not. The
        # java-v0.42.0 re-cut ran this step UNGUARDED (the tag predates this
        # commit), gradle reported :signMavenPublication,
        # :publishMavenPublicationToMavenCentralRepository and :releaseRepository
        # all executed, BUILD SUCCESSFUL — and every file under
        # dev/realmid/sdk/0.42.0/ still carries its original 13:35 timestamp.
        # Central accepted nothing and failed nothing. Immutability held; the
        # deployment was a silent no-op.
        #
        # So this guard is NOT protecting against a red run. What it buys is
        # that the no-op becomes explicit and deterministic — one logged line
        # instead of a full build-sign-upload cycle whose outcome depends on the
        # Portal's tolerance for a republish, which is not a contract we should
        # be relying on either way.
        #
        # The check runs BEFORE gradle rather than pattern-matching its failure:
        # Central's rejection text is not a contract, and a publish that failed
        # for some OTHER reason must still go red. `latest` is deliberately not
        # consulted — the metadata index lags the artifact by minutes (measured
        # this same day), so it would report "not published" for a version that
        # is. The pom's presence is the artifact itself.
        run: |
          set -euo pipefail
          # Read from build.gradle.kts, the same file changelog-hygiene.sh reads
          # and the one gradle itself publishes from. No JVM needed to decide
          # whether to start one.
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "::error::could not determine the java version to publish"; exit 1
          fi
          pom="https://repo1.maven.org/maven2/dev/realmid/sdk/${version}/sdk-${version}.pom"
          code="$(curl -s -o /dev/null -w '%{http_code}' "$pom")"
          if [ "$code" = "200" ]; then
            echo "dev.realmid:sdk ${version} is already on Maven Central — skipping publish"
            exit 0
          fi
          echo "dev.realmid:sdk ${version} not on Central (pom probe: ${code}) — publishing"
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
