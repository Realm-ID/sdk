name: publish-npm

# Publishes the JS/TS SDK packages to the npm `realm-id` org:
#   @realm-id/sdk              (ts/)
#   @realm-id/web              (web/packages/core)
#   @realm-id/web-react        (web/packages/react)
#   @realm-id/web-bff-realmid  (web/packages/bff-realmid)
#   @realm-id/web-admin        (web/packages/admin) — bundles @realm-id/sdk
#
# Auth: repo secret NPM_TOKEN — an npm Automation token (bypasses 2FA)
# owned by a member of the `realm-id` org.
#
# Trigger: manual (workflow_dispatch) or pushing a release tag. Re-runs are
# idempotent — an already-published version is treated as a skip, not a failure.

on:
  workflow_dispatch:
  push:
    tags:
      - 'ts-v*'
      - 'web-v*'

permissions:
  contents: read

defaults:
  run:
    # GitHub's implicit default omits pipefail
    shell: bash

concurrency:
  # NOT cancel-in-progress: a cancelled run of this workflow can leave
  # half-applied state behind. Queue instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Runaway guard, not an SLA (GitHub's default is 360m).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the tag OBJECT is needed, not just the commit


      # Runs BEFORE anything publishes, deliberately: a lightweight tag here is
      # still fixable (delete, re-cut with -a) because no registry has seen the
      # artifact yet. That is the opposite of `go/v*`, where the tag IS the
      # release — hence the separate `annotated-prepublish` mode, which prints
      # the recut remedy instead of "ship the next patch version".
      #
      # Only on a tag push: a workflow_dispatch has no tag to check.
      - name: The release tag is annotated
        if: github.event_name == 'push'
        run: ./scripts/tag-hygiene.sh annotated-prepublish "${{ github.ref_name }}"

      # Runs BEFORE any publish, and on workflow_dispatch too (it reads
      # package.json, not the tag): three packages silently lost changelog
      # history because nothing ever failed when a release skipped its entry.
      # Subjects are DERIVED from ts/ + web/packages/*, so a package added
      # later is covered the day it exists rather than when someone remembers.
      - name: Every publishable package has a changelog entry
        run: ./scripts/changelog-hygiene.sh npm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @realm-id/sdk (ts)
        working-directory: ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          # prepublishOnly runs `npm run build`
          if npm publish --access public 2>err.log; then
            echo "published @realm-id/sdk"
          elif grep -qiE 'cannot publish over|previously published version' err.log; then
            echo "@realm-id/sdk already published — skipping"
          else
            cat err.log; exit 1
          fi

      - name: Publish web packages (core, react, bff-realmid, admin)
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          # web-admin bundles @realm-id/sdk (bundledDependencies) so partners
          # get a self-contained tarball. Build ts once here so it can be staged
          # into packages/admin below.
          ( cd ../ts && npm ci && npm run build )
          # Build + publish in dependency order — core first, so react and
          # bff-realmid can resolve @realm-id/web's freshly-built .d.ts. A bare
          # `npm run build --workspaces` builds in listed order, not topological,
          # which fails on a clean checkout (no prebuilt dist). admin is last (it
          # peer-deps @realm-id/web and bundles @realm-id/sdk).
          for pkg in core react bff-realmid admin; do
            ( cd "packages/$pkg"
              npm run build
              # Repack gotcha (sdk/CLAUDE.md): the workspace install hoists
              # @realm-id/sdk out of packages/admin/node_modules, so npm would
              # publish web-admin WITHOUT its bundled dep. Stage a real copy
              # (fresh dist, no nested node_modules) right before publish.
              if [ "$pkg" = "admin" ]; then
                rm -rf node_modules/@realm-id/sdk
                mkdir -p node_modules/@realm-id
                cp -R ../../../ts node_modules/@realm-id/sdk
                rm -rf node_modules/@realm-id/sdk/node_modules
              fi
              if npm publish --access=public 2>err.log; then
                echo "published $pkg"
              elif grep -qiE 'cannot publish over|previously published version' err.log; then
                echo "$pkg already published — skipping"
              else
                cat err.log; exit 1
              fi
            )
          done
