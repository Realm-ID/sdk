name: publish-npm

# Publishes the JS/TS SDK packages to the npm `realm-id` org:
#   @realm-id/sdk              (ts/)
#   @realm-id/web              (web/packages/core)
#   @realm-id/web-react        (web/packages/react)
#   @realm-id/web-bff-realmid  (web/packages/bff-realmid)
#   @realm-id/web-admin        (web/packages/admin) — bundles @realm-id/sdk
#
# Auth: npm TRUSTED PUBLISHING (OIDC). No NPM_TOKEN, no secret of any kind —
# the job mints a short-lived credential from GitHub's OIDC provider and npm
# validates it against a trusted publisher registered on each package.
#
# WHY. npm removed classic automation tokens, and a granular token with publish
# rights is CAPPED AT 90 DAYS with no never-expire option. So a token-based
# publish does not fail if someone forgets to rotate it — it fails ON A
# SCHEDULE, forever. It did exactly that on 2026-09-18, mid-release, with a
# `404 Not Found - PUT` that reads like a missing package rather than a dead
# credential. OIDC removes the thing that expires.
#
# Each package carries its own trusted-publisher config on npm, pinning:
#   organization Realm-ID · repository sdk · workflow file publish-npm.yml
# ⚠️ npm pins those as NAME STRINGS. There is no repository-ID field, so the
# config follows the NAME — rename or transfer this repo and the publisher must
# be re-registered on all five packages, deliberately, before the next release.
# The optional Environment field is empty by choice; setting it (plus a GitHub
# environment with required reviewers) is the available hardening lever if a
# human approval per publish is ever wanted.
#
# ⚠️ `npm publish` must stay enabled under each package's "Allowed actions".
# npm permits `npm stage publish` always and plain `npm publish` only when
# explicitly allowed — and refuses with an error that reads like an auth
# failure, not a permission setting.
#
# Trigger: manual (workflow_dispatch) or pushing a release tag. Re-runs are
# idempotent — an already-published version is treated as a skip, not a failure.

on:
  workflow_dispatch:
  push:
    tags:
      - 'ts-v*'
      - 'web-v*'

permissions:
  contents: read
  # Mints the OIDC token npm exchanges for publish rights. Without it the job
  # has no credential at all — there is no token to fall back to.
  id-token: write

defaults:
  run:
    # GitHub's implicit default omits pipefail
    shell: bash

concurrency:
  # NOT cancel-in-progress: a cancelled run of this workflow can leave
  # half-applied state behind. Queue instead.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Runaway guard, not an SLA (GitHub's default is 360m).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the tag OBJECT is needed, not just the commit


      # Runs BEFORE anything publishes, deliberately: a lightweight tag here is
      # still fixable (delete, re-cut with -a) because no registry has seen the
      # artifact yet. That is the opposite of `go/v*`, where the tag IS the
      # release — hence the separate `annotated-prepublish` mode, which prints
      # the recut remedy instead of "ship the next patch version".
      #
      # Only on a tag push: a workflow_dispatch has no tag to check.
      - name: The release tag is annotated
        if: github.event_name == 'push'
        run: ./scripts/tag-hygiene.sh annotated-prepublish "${{ github.ref_name }}"

      # Runs BEFORE any publish, and on workflow_dispatch too (it reads
      # package.json, not the tag): three packages silently lost changelog
      # history because nothing ever failed when a release skipped its entry.
      # Subjects are DERIVED from ts/ + web/packages/*, so a package added
      # later is covered the day it exists rather than when someone remembers.
      - name: Every publishable package has a changelog entry
        run: ./scripts/changelog-hygiene.sh npm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs Node >= 22.14.0 AND npm >= 11.5.1.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # ASSERT the npm version rather than assume it. Which npm ships inside a
      # given Node line is not a fact this repo controls, and an npm that is too
      # old does not say so — the publish fails on authentication, which sends
      # you to the token settings for a credential that no longer exists.
      - name: npm must be >= 11.5.1 for trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          echo "node $(node --version) / npm $have"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have is older than $need — upgrading"
            npm install -g "npm@>=$need"
            echo "npm now $(npm --version)"
          fi

      - name: Publish @realm-id/sdk (ts)
        working-directory: ts
        run: |
          npm ci
          # prepublishOnly runs `npm run build`
          if npm publish --access public 2>err.log; then
            echo "published @realm-id/sdk"
          elif grep -qiE 'cannot publish over|previously published version' err.log; then
            echo "@realm-id/sdk already published — skipping"
          else
            cat err.log; exit 1
          fi

      - name: Publish web packages (core, react, bff-realmid, admin)
        working-directory: web
        run: |
          npm ci
          # web-admin bundles @realm-id/sdk (bundledDependencies) so partners
          # get a self-contained tarball. Build ts once here so it can be staged
          # into packages/admin below.
          ( cd ../ts && npm ci && npm run build )
          # Build + publish in dependency order — core first, so react and
          # bff-realmid can resolve @realm-id/web's freshly-built .d.ts. A bare
          # `npm run build --workspaces` builds in listed order, not topological,
          # which fails on a clean checkout (no prebuilt dist). admin is last (it
          # peer-deps @realm-id/web and bundles @realm-id/sdk).
          for pkg in core react bff-realmid admin; do
            ( cd "packages/$pkg"
              npm run build
              # Repack gotcha (sdk/CLAUDE.md): the workspace install hoists
              # @realm-id/sdk out of packages/admin/node_modules, so npm would
              # publish web-admin WITHOUT its bundled dep. Stage a real copy
              # (fresh dist, no nested node_modules) right before publish.
              if [ "$pkg" = "admin" ]; then
                rm -rf node_modules/@realm-id/sdk
                mkdir -p node_modules/@realm-id
                cp -R ../../../ts node_modules/@realm-id/sdk
                rm -rf node_modules/@realm-id/sdk/node_modules
              fi
              if npm publish --access=public 2>err.log; then
                echo "published $pkg"
              elif grep -qiE 'cannot publish over|previously published version' err.log; then
                echo "$pkg already published — skipping"
              else
                cat err.log; exit 1
              fi
            )
          done
