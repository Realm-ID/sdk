name: deploy-mcp

# Deploys the read-only docs MCP server (mcp/) to Cloudflare Workers as mcp.realmid.dev.
#
# MANUAL ONLY (workflow_dispatch). There is no push or tag trigger on purpose: the owner decides when
# the docs go live. The docs index is built from this checkout, so the worker serves exactly the
# commit that was run, and the last step proves it from the outside.
#
# SELF-CONTAINED and ACTION-FREE, same shape as Realm-ID/website's deploy.yml: only GitHub-authored
# actions/checkout + actions/setup-node (SHA-pinned), then `npx wrangler`. No cloudflare/wrangler-action.
#
# Creds: CLOUDFLARE_API_TOKEN secret (Workers Scripts:Edit, plus Routes/DNS edit on the realmid.dev
# zone) + CLOUDFLARE_ACCOUNT_ID variable, minted by infra-provisioning's `mint-cloudflare-tokens`
# (profile workers-deploy-realmid) into the GitHub Environment `production` of this repo
# (restricted to main). wrangler reads both from the environment. Neither exists yet: until they do,
# the preflight step below fails with a clear message and nothing is published.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

defaults:
  run:
    # GitHub's implicit default omits pipefail
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22' # wrangler 4.x needs Node 22

      - name: Preflight - deploy creds present
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]  || { echo "::error::CLOUDFLARE_API_TOKEN secret not set in the 'production' environment (minted by infra-provisioning's mint-cloudflare-tokens, profile workers-deploy-realmid)."; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID variable not set in the 'production' environment (minted by infra-provisioning's mint-cloudflare-tokens, profile workers-deploy-realmid)."; exit 1; }

      - name: Install and test (builds the docs index, typechecks, runs the suite)
        working-directory: mcp
        run: |
          set -euo pipefail
          npm ci
          npm test

      # Version pinned to mcp/package.json's wrangler devDependency. Both deploy paths bundle the
      # index that `npm test` just built into mcp/src/generated/.
      - name: Deploy to Cloudflare Workers
        working-directory: mcp
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.0 deploy

      # A deploy that exits 0 proves nothing about what is serving. Read it back from the outside:
      # GET / must name THIS commit, and a real MCP tools/list must return all five tools. The retry
      # only absorbs first-deploy custom-domain/certificate propagation (6 x 10 s), nothing else.
      - name: Prove the deployed worker serves this commit
        working-directory: mcp
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-deployed.mjs https://mcp.realmid.dev "$GITHUB_SHA"; then
              exit 0
            fi
            echo "attempt $attempt failed; waiting for propagation"
            sleep 10
          done
          echo "::error::https://mcp.realmid.dev did not serve commit $GITHUB_SHA with all 5 tools after 6 attempts"
          exit 1
