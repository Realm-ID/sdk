name: deploy-mcp

# Deploys the read-only docs MCP server (mcp/) to Cloudflare Workers as mcp.realmid.dev.
#
# MANUAL ONLY. There is no push or tag trigger on purpose: the owner decides when the docs go live.
# Needs the repo secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on the account, plus Workers
# Routes:Edit / DNS:Edit on the realmid.dev zone for the custom domain). That secret DOES NOT EXIST
# yet; until the owner adds it, a run fails at the deploy step and nothing is published.
# The docs index is built from this checkout, so the worker serves exactly the commit that was run.

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install
        working-directory: mcp
        run: |
          set -euo pipefail
          npm ci

      - name: Test (builds the docs index, typechecks, runs the suite)
        working-directory: mcp
        run: |
          set -euo pipefail
          npm test

      - name: Deploy
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it as a repository secret, then re-run."
            exit 1
          fi
          npx wrangler deploy
